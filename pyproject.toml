[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "video-object-remover"
version = "0.3.0"
description = "Rotoscope or remove objects in video: SAM 2 tracking with ProRes matte export and ProPainter inpainting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "QuantumWars" }]
keywords = ["video", "inpainting", "object-removal", "sam", "sam2", "rotoscoping",
            "watermark", "propainter", "ffmpeg"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.6",
    # The python.org build does not use the macOS system trust store, so the
    # model downloader cannot verify TLS without a bundled CA set.
    "certifi",
]

# The web UI is optional: the CLI works without a server stack installed.
[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/QuantumWars/video-object-remover"
Issues = "https://github.com/QuantumWars/video-object-remover/issues"

[project.scripts]
video-object-remover = "video_object_remover.cli:main"

[tool.setuptools]
packages = ["video_object_remover", "video_object_remover.webapp"]

[tool.setuptools.package-data]
# The UI is a Vite build: index.html plus a hashed assets/ folder. The bare
# "static/*" glob does not descend, so the wheel would ship the HTML with no
# JS or CSS — a blank page that looks like a runtime bug.
"video_object_remover.webapp" = ["static/*", "static/assets/*"]
